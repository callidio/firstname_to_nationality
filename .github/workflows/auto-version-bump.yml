name: Auto Version Bump

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  bump-version:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Check if last commit is a version bump
        id: check_commit
        run: |
          LAST_COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Last commit message: $LAST_COMMIT_MSG"
          
          # Check if the last commit message contains version bump indicators
          if echo "$LAST_COMMIT_MSG" | grep -qiE "(bump version|version bump|update version|chore: bump version)"; then
            echo "Last commit was a version bump, skipping..."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Last commit was not a version bump, proceeding..."
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Set up Python
        if: steps.check_commit.outputs.skip == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Extract and bump version
        if: steps.check_commit.outputs.skip == 'false'
        id: bump
        run: |
          # Extract current version from setup.py
          CURRENT_VERSION=$(grep -oP 'version="\K[^"]+' setup.py)
          echo "Current version: $CURRENT_VERSION"
          
          # Parse version components
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
          
          # Increment patch version
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
          
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
      
      - name: Update version in setup.py
        if: steps.check_commit.outputs.skip == 'false'
        run: |
          sed -i 's/version="${{ steps.bump.outputs.current_version }}"/version="${{ steps.bump.outputs.new_version }}"/' setup.py
          
          # Verify the change
          grep "version=" setup.py
      
      - name: Create Pull Request
        if: steps.check_commit.outputs.skip == 'false'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: bump version to ${{ steps.bump.outputs.new_version }}"
          title: "chore: bump version to ${{ steps.bump.outputs.new_version }}"
          body: |
            ## Automated Version Bump
            
            This PR was automatically created after a merge to the main branch.
            
            - Previous version: ${{ steps.bump.outputs.current_version }}
            - New version: ${{ steps.bump.outputs.new_version }}
            
            This PR bumps the patch version in `setup.py`.
          branch: auto-version-bump-${{ steps.bump.outputs.new_version }}
          delete-branch: true
          labels: |
            automated
            version-bump
