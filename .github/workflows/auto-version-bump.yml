name: Auto Version Bump

# This workflow automatically bumps the version and creates a PR
# 
# SETUP REQUIRED: To avoid "Not permitted to create pull requests" error:
# 1. Create a Personal Access Token (PAT) at https://github.com/settings/tokens
# 2. Give it 'repo' and 'workflow' scopes
# 3. Add it as a repository secret named 'PAT_TOKEN'
# 4. See .github/WORKFLOW_SETUP.md for detailed instructions

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create branches
      pull-requests: write  # Required to create PRs (GITHUB_TOKEN cannot trigger workflows from PRs)
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for version calculation
          # Use PAT_TOKEN if available, otherwise fall back to GITHUB_TOKEN
          # Note: GITHUB_TOKEN has restrictions on creating PRs that trigger workflows
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
      
      - name: Calculate next version
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          patchAll: true
          skipInvalidTags: true
      
      - name: Set up Python
        if: steps.semver.outputs.next != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Update version in setup.py
        if: steps.semver.outputs.next != ''
        run: |
          NEXT_VERSION="${{ steps.semver.outputs.next }}"
          echo "Updating version to: $NEXT_VERSION"
          
          # Update version in setup.py
          sed -i "s/version=\"[^\"]*\"/version=\"${NEXT_VERSION}\"/" setup.py
          
          # Verify the change
          if grep -q "version=\"${NEXT_VERSION}\"" setup.py; then
            echo "✓ Version successfully updated to ${NEXT_VERSION}"
            grep "version=" setup.py
          else
            echo "✗ Error: Failed to update version"
            exit 1
          fi
      
      - name: Create Pull Request for version bump
        if: steps.semver.outputs.next != ''
        uses: peter-evans/create-pull-request@v6
        with:
          # Use PAT_TOKEN if available for proper PR creation
          # GITHUB_TOKEN cannot create PRs that trigger other workflows
          # See: https://github.com/peter-evans/create-pull-request/blob/main/docs/concepts-guidelines.md#triggering-further-workflow-runs
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "chore(release): ${{ steps.semver.outputs.next }} [skip ci]"
          title: "chore(release): Bump version to ${{ steps.semver.outputs.next }}"
          body: |
            ## Version Bump to ${{ steps.semver.outputs.next }}
            
            This PR was automatically generated to bump the version.
            
            ### Changes
            - Updated version in `setup.py` to `${{ steps.semver.outputs.next }}`
            
            ### Changelog
            ${{ steps.semver.outputs.changelog }}
            
            ---
            **Note**: This PR was created by the auto-version-bump workflow.
          branch: release/${{ steps.semver.outputs.next }}
          delete-branch: true
          labels: |
            release
            automated
          add-paths: |
            setup.py
