name: Auto Version Bump

# This workflow automatically bumps the version and pushes directly to main
# using GitHub App authentication (AutoBot-Callidio)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  bump-version:
    runs-on: ubuntu-latest
    # Skip if the commit was made by the bot to prevent infinite loops
    if: github.actor != 'AutoBot-Callidio[bot]' && github.event.head_commit.author.name != 'AutoBot-Callidio[bot]'
    permissions:
      contents: write  # Required to push to main and create tags
    
    steps:
      - name: Generate GitHub App Token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.AUTOBOT_CALLIDIO_APP_ID }}
          private-key: ${{ secrets.AUTOBOT_CALLIDIO_PRIVATE_KEY }}
      
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history needed for version calculation
          token: ${{ steps.generate_token.outputs.token }}
      
      - name: Calculate next version
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ steps.generate_token.outputs.token }}
          branch: main
          patchAll: true
          skipInvalidTags: true
      
      - name: Set up Python
        if: steps.semver.outputs.next != ''
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      
      - name: Update version in setup.py
        if: steps.semver.outputs.next != ''
        run: |
          # Strip 'v' prefix from version if present
          NEXT_VERSION="${{ steps.semver.outputs.next }}"
          NEXT_VERSION="${NEXT_VERSION#v}"
          echo "Updating version to: $NEXT_VERSION"
          
          # Update version in setup.py
          sed -i "s/version=\"[^\"]*\"/version=\"${NEXT_VERSION}\"/" setup.py
          
          # Verify the change
          if grep -q "version=\"${NEXT_VERSION}\"" setup.py; then
            echo "✓ Version successfully updated to ${NEXT_VERSION}"
            grep "version=" setup.py
          else
            echo "✗ Error: Failed to update version"
            exit 1
          fi
      
      - name: Configure Git
        if: steps.semver.outputs.next != ''
        run: |
          git config user.name "AutoBot-Callidio[bot]"
          git config user.email "autobot-callidio[bot]@users.noreply.github.com"
      
      - name: Commit, Push, and Tag version bump
        if: steps.semver.outputs.next != ''
        run: |
          # Strip 'v' prefix from version if present
          NEXT_VERSION="${{ steps.semver.outputs.next }}"
          NEXT_VERSION="${NEXT_VERSION#v}"
          
          # Add the changed file
          git add setup.py
          
          # Create commit message file so expressions are safely written as data
          cat > /tmp/commit-msg.txt << EOF
          chore(release): bump version to ${NEXT_VERSION}
          
          Automated version bump by AutoBot-Callidio
          
          Changelog:
          ${{ steps.semver.outputs.changelog }}
          EOF
          
          # Commit the changes using the message file
          git commit -F /tmp/commit-msg.txt
          
          # Create tag message file to handle special characters safely
          cat > /tmp/tag-msg.txt << EOF
          Release version ${NEXT_VERSION}
          
          Changelog:
          ${{ steps.semver.outputs.changelog }}
          EOF
          
          # Create an annotated tag using the message file (without v prefix)
          git tag -a "${NEXT_VERSION}" -F /tmp/tag-msg.txt
          
          # Push commit and tag together atomically
          # If either fails, both will fail and nothing gets pushed
          git push origin main "${NEXT_VERSION}"
          
          echo "✓ Successfully pushed version bump and tag ${NEXT_VERSION}"
