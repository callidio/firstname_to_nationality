name: Auto Version Bump

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  bump-version:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to push changes and create releases
      pull-requests: write  # Required to create PRs
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for version calculation
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Calculate next version
        id: semver
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          noVersionBumpBehavior: silent
          skipInvalidTags: true
      
      - name: Set up Python
        if: steps.semver.outputs.next != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Update version in setup.py
        if: steps.semver.outputs.next != ''
        run: |
          NEXT_VERSION="${{ steps.semver.outputs.next }}"
          echo "Updating version to: $NEXT_VERSION"
          
          # Update version in setup.py
          sed -i "s/version=\"[^\"]*\"/version=\"${NEXT_VERSION}\"/" setup.py
          
          # Verify the change
          if grep -q "version=\"${NEXT_VERSION}\"" setup.py; then
            echo "✓ Version successfully updated to ${NEXT_VERSION}"
            grep "version=" setup.py
          else
            echo "✗ Error: Failed to update version"
            exit 1
          fi
      
      - name: Commit version bump
        if: steps.semver.outputs.next != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add setup.py
          git commit -m "chore(release): ${{ steps.semver.outputs.next }} [skip ci]"
          git push
      
      - name: Create GitHub Release
        if: steps.semver.outputs.next != ''
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.semver.outputs.next }}
          release_name: Release ${{ steps.semver.outputs.next }}
          body: ${{ steps.semver.outputs.changelog }}
          draft: false
          prerelease: false
